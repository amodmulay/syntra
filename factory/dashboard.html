<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syntra factory</title>
<script>
// Runs before <body> is parsed so the first paint already has the right theme.
// The saved-value check must stay identical to savedTheme() in the body script.
(function () {
  var theme = null
  try {
    var saved = localStorage.getItem('syntra-factory-theme')
    if (saved === 'light' || saved === 'dark') theme = saved
  } catch (e) { /* storage unavailable: nothing saved */ }
  if (theme === null) {
    try {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
    } catch (e) { theme = 'dark' }
  }
  document.documentElement.setAttribute('data-theme', theme)
})()
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a1020;
    --panel: #0f1730;
    --side: #0c1429;
    --card: #152041;
    --card-hover: #1c2a52;
    --line: #26355d;
    --text: #e9eefb;
    --muted: #9aa7c7;
    --faint: #8794b5;
    --active: #5eead4;
    --pass: #4ade80;
    --changes: #fbbf24;
    --human: #fb7185;
    --merged: #a78bfa;
    --accent: #5eead4;
    --on-accent: #06231f;
    --scrim: rgba(3, 6, 16, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px -14px rgba(0, 0, 0, .6);
    --radius: 14px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f3efe6;
    --panel: #faf7f0;
    --side: #1f2a44;
    --card: #fffdf8;
    --card-hover: #f7f1e3;
    --line: #ddd4c1;
    --text: #1d2230;
    --muted: #535b6f;
    --faint: #626a7d;
    --active: #0a6c63;
    --pass: #166534;
    --changes: #92400e;
    --human: #be123c;
    --merged: #6d28d9;
    --accent: #0a6c63;
    --on-accent: #ffffff;
    --scrim: rgba(25, 28, 45, .35);
    --shadow: 0 1px 2px rgba(60, 50, 20, .08), 0 8px 22px -14px rgba(60, 50, 20, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh;
  }
  button { font: inherit; color: inherit; }

  /* Sidebar (always dark so the navy rail anchors both themes) */
  .side {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 22px; padding: 22px 16px;
    background: var(--side); border-right: 1px solid var(--line);
    --s-text: #e9eefb; --s-muted: #a9b5d3; --s-line: #33436f;
    color: var(--s-text);
  }
  :root[data-theme="dark"] .side { --s-line: var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; padding: 0 6px; }
  .logo {
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(135deg, #5eead4, #818cf8); color: #07122b;
    font-weight: 800; font-size: 19px; letter-spacing: -.02em;
  }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
  .brand small { display: block; font-size: 11px; font-weight: 500; color: var(--s-muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
  .views { display: flex; flex-direction: column; gap: 4px; }
  .views button {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left;
    font-size: 13.5px; font-weight: 500; color: var(--s-muted); background: none;
    border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .views button:hover { color: var(--s-text); background: rgba(255, 255, 255, .06); }
  .views button[aria-pressed="true"] { color: #07122b; background: #5eead4; font-weight: 600; }
  .views button:focus-visible, #theme-toggle:focus-visible { outline: 2px solid #5eead4; outline-offset: 2px; }
  .views button[aria-pressed="true"]:focus-visible { outline-color: #fff; }
  #pending-count:not(:empty) {
    font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
    background: rgba(255, 255, 255, .14); color: inherit;
  }
  .views button[aria-pressed="true"] #pending-count:not(:empty) { background: rgba(7, 18, 43, .18); }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 14px; }
  .status { font-family: var(--mono); font-size: 11px; color: var(--s-muted); overflow-wrap: anywhere; }
  .status .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #4ade80; margin-right: 7px; vertical-align: 0; box-shadow: 0 0 0 3px rgba(74, 222, 128, .2);
  }
  .status.error { color: #fda4af; }
  .status.error .dot { background: #fb7185; box-shadow: 0 0 0 3px rgba(251, 113, 133, .2); }
  #theme-toggle {
    font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap; text-align: center;
    color: var(--s-text); background: rgba(255, 255, 255, .06); border: 1px solid var(--s-line);
    border-radius: 10px; padding: 9px 10px; cursor: pointer; transition: background .15s;
  }
  #theme-toggle:hover { background: rgba(255, 255, 255, .12); }
  .cmds { display: grid; gap: 4px; font-family: var(--mono); font-size: 11px; color: var(--s-muted); }
  .cmds span { padding: 3px 8px; border-radius: 6px; background: rgba(255, 255, 255, .05); overflow-wrap: anywhere; }
  .main { min-width: 0; }
  .banner {
    margin: 16px 32px 0; padding: 10px 14px; border: 1px solid var(--human);
    border-radius: 10px; color: var(--human); font-family: var(--mono); font-size: 12px;
  }

  /* Summary tiles */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; padding: 28px 32px 0; }
  .kpi {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .kpi .k-label { font-size: 12px; font-weight: 500; color: var(--muted); }
  .kpi .k-value { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin-top: 2px; }
  .kpi.k-run .k-value { color: var(--active); }
  .kpi.k-human .k-value.on { color: var(--human); }
  .kpi.k-done .k-value { color: var(--merged); }

  /* Views: not picked up, task stats */
  .board[hidden], .view[hidden] { display: none; }
  .view { padding: 24px 32px 40px; }
  .view h2 { font-size: 16px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
  .view .lede { font-size: 13px; color: var(--muted); margin: 0 0 14px; max-width: 80ch; }
  .view .block + .block { margin-top: 32px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
  .view table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .view th, .view td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .view th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; background: var(--card-hover); }
  .view tr:last-child td { border-bottom: 0; }
  .view td.num, .view th.num { text-align: right; font-family: var(--mono); white-space: nowrap; }
  .view td.mono { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .view tr[data-job] { cursor: pointer; }
  .view tr[data-job]:hover td { background: var(--card-hover); }
  .view .t-title { color: var(--text); font-weight: 500; }
  .view .t-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
  .view tfoot td { font-family: var(--mono); font-size: 12px; color: var(--text); border-top: 1px solid var(--line); border-bottom: 0; background: var(--card-hover); }
  .badge { font-size: 11px; font-weight: 500; white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--muted); }
  .badge.auto { color: var(--pass); border-color: var(--pass); }
  .badge.human { color: var(--changes); border-color: var(--changes); }
  .badge.wait { color: var(--human); border-color: var(--human); }

  /* Board: one lane per stage, top to bottom */
  .board { display: flex; flex-direction: column; padding: 24px 32px 40px; counter-reset: step; }
  .col {
    display: grid; grid-template-columns: 172px minmax(0, 1fr); gap: 20px;
    counter-increment: step; position: relative; padding-bottom: 22px; min-width: 0;
  }
  .col:not(:last-child)::before {
    content: ""; position: absolute; left: 15px; top: 36px; bottom: 4px; width: 2px;
    background: var(--line); border-radius: 2px;
  }
  .col-head { display: grid; grid-template-columns: 32px 1fr; column-gap: 12px; align-items: start; align-content: start; }
  .col-head::before {
    content: counter(step); grid-row: 1 / span 2; width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
    background: var(--card); border: 2px solid var(--line); color: var(--muted); position: relative;
  }
  .col.has-cards .col-head::before { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .col-head h2 { margin: 0; font-size: 15px; font-weight: 700; line-height: 32px; display: flex; align-items: center; gap: 8px; }
  .col-head .who { grid-column: 2; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -4px; }
  .col-head .count {
    font-size: 11px; font-weight: 700; color: var(--muted); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; line-height: 18px;
  }
  .col-head .count:empty { display: none; }
  .col.human .col-head h2 { color: var(--human); }
  .col.human.has-cards .col-head::before { background: var(--human); border-color: var(--human); color: #fff; }
  .col.merged-col .col-head h2 { color: var(--merged); }
  .col.merged-col.has-cards .col-head::before { background: var(--merged); border-color: var(--merged); color: #fff; }
  .lane-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 12px; align-items: start; min-width: 0; }
  .empty { color: var(--faint); font-size: 13px; padding: 4px 2px; }
  .lane-cards .empty { line-height: 32px; padding: 0; }

  /* Cards */
  .card {
    display: block; width: 100%; text-align: left; cursor: pointer; color: inherit; position: relative; overflow: hidden;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 14px 12px 18px; box-shadow: var(--shadow);
    transition: background .15s, border-color .15s, transform .15s;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--line); }
  .card.live::before { background: var(--active); }
  .card.human::before { background: var(--human); }
  .card.merged::before { background: var(--merged); }
  .card.rejected::before, .card.needs-info::before { background: var(--changes); }
  .card:hover { background: var(--card-hover); transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
  .card.human { border-color: var(--human); }
  /* Done cards are not faded: an opacity fade drops muted text under 4.5:1.
     Local Done cards still open the drawer, so they keep the normal hover background; their
     text goes to --text on hover. */
  .card.done .feature, .card.done .links { color: var(--muted); }
  .card.done:not(.record):hover { background: var(--card-hover); }
  .card.done:not(.record):hover .feature, .card.done:not(.record):hover .links { color: var(--text); }
  .card.rejected .feature { text-decoration: line-through; text-decoration-color: var(--faint); }
  .flag.wait { color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  /* Record cards (from factory/records/, no job folder here) have nothing to open: no hover lift or fill. */
  .card.record { cursor: default; }
  .card.record:hover { background: var(--card); transform: none; }
  .card.record .num { flex-shrink: 0; }
  .card.record .feature { overflow-wrap: anywhere; }
  .origin { font-size: 11px; line-height: 1.4; color: var(--muted); margin: 0 0 6px; overflow-wrap: anywhere; }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .num { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .card-top .num { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%; background: var(--active);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--active) 25%, transparent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .flag {
    margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--human); white-space: nowrap;
    background: color-mix(in srgb, var(--human) 14%, transparent); padding: 2px 8px; border-radius: 999px;
  }
  .feature { font-size: 14px; font-weight: 600; line-height: 1.4; margin: 0 0 6px; letter-spacing: -.005em; }
  .links { display: flex; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .meta > span { background: color-mix(in srgb, var(--muted) 12%, transparent); padding: 2px 8px; border-radius: 999px; }
  .meta .line { color: var(--active); font-weight: 600; }
  .meta .models { color: var(--text); }
  .models-table { margin-top: 8px; border-collapse: collapse; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .models-table th, .models-table td { text-align: left; padding: 2px 12px 2px 0; font-weight: normal; }
  .models-table th:nth-child(n+3), .models-table td:nth-child(n+3) { text-align: right; }
  .meta .risk-high { color: var(--human); } .meta .risk-medium { color: var(--changes); }
  .chip.gate { flex: 0 0 40px; }
  .chip.FAIL { border: 1px solid transparent; color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .rounds { margin-top: 12px; display: grid; gap: 5px; }
  .round { display: flex; align-items: center; gap: 4px; }
  .round .r { font-family: var(--mono); font-size: 10px; color: var(--faint); width: 20px; }
  .chip {
    flex: 1; text-align: center; font-family: var(--mono); font-size: 10px;
    padding: 2px 0; border-radius: 999px; border: 1px dashed var(--faint); color: var(--faint);
  }
  .chip.wait { animation: breathe 1.6s ease-in-out infinite; }
  .chip.PASS {
    border: 1px solid transparent; color: var(--pass);
    background: color-mix(in srgb, var(--pass) 14%, transparent);
  }
  .chip.CHANGES {
    border: 1px solid transparent; color: var(--changes);
    background: color-mix(in srgb, var(--changes) 16%, transparent);
  }
  .chip.bad { border: 1px solid var(--human); color: var(--human); }
  .hint {
    margin-top: 10px; padding: 8px 10px; border-radius: 8px;
    background: color-mix(in srgb, var(--human) 10%, transparent);
    font-family: var(--mono); font-size: 11px; color: var(--text); line-height: 1.6;
    overflow-wrap: anywhere;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .chip.wait { animation: none; } .card { transition: none; } }

  /* Drawer */
  .scrim {
    position: fixed; inset: 0; background: var(--scrim); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .drawer {
    position: fixed; top: 10px; right: 10px; bottom: 10px; width: min(920px, calc(100vw - 20px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .6);
    display: grid; grid-template-rows: auto 1fr; transform: translateX(110%);
    transition: transform .25s ease;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .drawer { transform: none; }
  .d-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); position: relative; background: var(--card); }
  .d-head .num { font-size: 12px; }
  .d-head h3 { margin: 4px 40px 6px 0; font-size: 18px; font-weight: 700; line-height: 1.35; letter-spacing: -.01em; }
  .close {
    position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
    border-radius: 50%; border: 1px solid var(--line); background: var(--panel); cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1;
  }
  .close:hover { color: var(--text); border-color: var(--muted); }
  .d-body { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
  .files { border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; }
  .files .group {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--faint); margin: 12px 8px 4px;
  }
  .files .group:first-child { margin-top: 0; }
  .file {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .file:hover { background: var(--card); color: var(--text); }
  .file.on { background: var(--card-hover); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
  .file .rn { display: none; }
  .file .v { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .v.good { background: var(--pass); } .v.warn { background: var(--changes); } .v.stop { background: var(--human); }
  .doc { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }

  /* Rendered markdown */
  .md { max-width: 680px; line-height: 1.65; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.6em 0 .5em; }
  .md h1 { font-size: 21px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14px; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 .9em; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md li.task::before { content: "☐"; margin-right: .5em; color: var(--faint); }
  .md li.task.done::before { content: "☑"; color: var(--pass); }
  .md code {
    font-family: var(--mono); font-size: 12px; background: var(--card);
    padding: 1px 5px; border-radius: 5px;
  }
  .md pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; overflow-x: auto;
  }
  /* Light: the card tint is too close to the drawer panel, so inline code gets a border. */
  :root[data-theme="light"] .md :not(pre) > code { background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--muted); }
  .md a { color: var(--active); }
  .md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .verdict {
    display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 700;
    padding: 4px 12px; border-radius: 999px; margin-bottom: 14px;
  }
  .verdict + * { margin-top: .4em; }
  .md .head { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: -6px 0 14px; white-space: pre-line; }
  .verdict.good { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .verdict.warn { color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  .verdict.stop { color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .note { color: var(--faint); font-size: 13px; }
  .md .summary {
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px;
    padding: 12px 16px 4px; margin: 0 0 22px;
  }
  .md .summary h2 {
    margin: 0 0 6px; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted);
  }
  .md .summary ul { margin: 0 0 .6em; }

  @media (max-width: 1000px) {
    body { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 16px; border-right: 0; }
    .views { flex-direction: row; flex-wrap: wrap; }
    .side-foot { margin-top: 0; flex-direction: row; flex-wrap: wrap; align-items: center; margin-left: auto; }
    .cmds { display: none; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 20px 16px 0; }
    .banner { margin: 12px 16px 0; }
    .board { padding: 20px 16px 32px; }
    .view { padding: 20px 16px 32px; }
  }
  @media (max-width: 640px) {
    .col { grid-template-columns: 1fr; gap: 10px; }
    .col::before { display: none; }
    .drawer { top: 0; right: 0; bottom: 0; width: 100vw; border-radius: 0; }
    .d-head { padding: 16px; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files {
      border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px;
      overflow-x: auto; padding: 8px;
    }
    .files .group { display: none; }
    .file { width: auto; white-space: nowrap; }
    .file .rn { display: inline; white-space: pre; }
    .doc { padding: 18px 16px 48px; }
  }
</style>
</head>
<body>
<aside class="side">
  <div class="brand">
    <div class="logo" aria-hidden="true">S</div>
    <h1>Syntra<small>Factory</small></h1>
  </div>
  <nav class="views" aria-label="Views">
    <button type="button" data-view="board" aria-pressed="true">Pipeline</button>
    <button type="button" data-view="pending" aria-pressed="false"><span>Not picked up</span> <span id="pending-count"></span></button>
    <button type="button" data-view="stats" aria-pressed="false">Task stats</button>
  </nav>
  <div class="side-foot">
    <div class="cmds" aria-label="Commands">
      <span>/factory run</span>
      <span>/factory run &lt;topic&gt;</span>
      <span>/factory &lt;anything&gt;</span>
    </div>
    <div class="status" id="status">connecting…</div>
    <button id="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch to light theme">Light</button>
  </div>
</aside>
<div class="main">
  <div id="banner"></div>
  <div class="kpis" id="kpis"></div>
  <main class="board" id="board"></main>
  <section class="view" id="view-pending" hidden></section>
  <section class="view" id="view-stats" hidden></section>
</div>

<div id="overlay">
  <div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="d-head">
      <div class="num" id="d-num"></div>
      <h3 id="d-title"></h3>
      <div class="links" id="d-links"></div>
      <button class="close" data-close aria-label="Close">×</button>
    </div>
    <div class="d-body">
      <nav class="files" id="d-files"></nav>
      <article class="doc"><div class="md" id="d-doc"></div></article>
    </div>
  </aside>
</div>

<script>
const POLL_MS = 2000
const COLUMNS = [
  { label: 'Triage', who: 'triage', stages: ['triage', 'needs-info'] },
  { label: 'Spec', who: 'spec-writer', stages: ['spec'] },
  { label: 'Build', who: 'builder · gate', stages: ['build', 'gate'] },
  { label: 'Review', who: 'routed reviewers', stages: ['review'] },
  { label: 'Approve', who: 'approver · land', stages: ['approve', 'merging'] },
  { label: 'Needs human', who: 'you', stages: ['needs-human'], cls: 'human' },
  { label: 'Done', who: 'merged · rejected', stages: ['merged', 'rejected'], cls: 'merged-col' },
]
const STAGES = new Set(COLUMNS.flatMap((c) => c.stages))
const LIVE = new Set(['triage', 'spec', 'build', 'gate', 'review', 'approve', 'merging'])
const SHORT = { code: 'code', ux: 'ux', ui: 'ui', security: 'sec' }

const modelName = (m) => String(m).replace(/^claude-/, '').replace(/-\d+(-\d+)?$/, '')
// Distinct models a job has used, e.g. "haiku · sonnet"; per-step detail goes in the title.
function modelsChip(job) {
  const rows = job.models || []
  if (!rows.length) return ''
  const names = [...new Set(rows.map((r) => modelName(r.model)))]
  const title = rows.map((r) => `${r.step}: ${r.model} (${r.calls} calls, ${r.tokens.toLocaleString()} tokens)`).join('\n')
  return `<span class="models" title="${esc(title)}">${esc(names.join(' · '))}</span>`
}
function modelsTable(job) {
  const rows = job.models || []
  if (!rows.length) return ''
  return `<table class="models-table"><thead><tr><th>Step</th><th>Model</th><th>Calls</th><th>Tokens</th><th>Cost</th></tr></thead><tbody>${
    rows.map((r) => `<tr><td>${esc(r.step)}</td><td>${esc(r.model)}</td><td>${r.calls}</td><td>${r.tokens.toLocaleString()}</td><td>$${Number(r.cost).toFixed(2)}</td></tr>`).join('')
  }</tbody></table>`
}

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const pass2 = (job) => `${String(job.pass).padStart(2, '0')}-${job.line}`

let jobs = []
// Finished jobs read from factory/records/ (see loadRecords). Kept apart from jobs.
let records = []
const recordCache = new Map() // record file name -> parsed record, or null if it did not parse
let lastRender = ''
const roundCache = new Map() // "<job>/<pass>/<n>" -> verdicts of a finished round
let openJobId = null
let openPath = null
let openText = null

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`)
  return res.text()
}

async function fetchFirst(url) {
  try { return (await fetchText(url)).split('\n')[0].trim() } catch { return null }
}

// ---- Board ---------------------------------------------------------------

function verdictOf(line) {
  if (line === null) return 'pending'
  const m = line.match(/^(?:VERDICT|GATE):\s*(PASS|CHANGES|FAIL)$/)
  return m ? m[1] : 'invalid'
}

// A round's verdicts come from its files: the gate first, then each routed reviewer.
async function roundVerdicts(job, n) {
  const key = `${job.id}/${pass2(job)}/${n}`
  if (roundCache.has(key)) return roundCache.get(key)
  const dir = `jobs/${job.id}/${pass2(job)}/round-${n}/`
  const v = { gate: verdictOf(await fetchFirst(dir + 'checks.md')), reviews: {} }
  if (v.gate === 'PASS') {
    await Promise.all(Object.keys(job.agents?.reviewers || {}).map(async (r) => {
      v.reviews[r] = verdictOf(await fetchFirst(`${dir}review-${r}.md`))
    }))
  }
  const settled = v.gate === 'FAIL' || (v.gate === 'PASS' && Object.values(v.reviews).every((x) => x === 'PASS' || x === 'CHANGES'))
  if (settled && n < job.round) roundCache.set(key, v)
  return v
}

function chip(label, v, waiting, title, extra = '') {
  const cls = ['PASS', 'CHANGES', 'FAIL'].includes(v) ? v : v === 'pending' ? (waiting ? 'wait' : '') : 'bad'
  return `<span class="chip ${extra} ${cls}" title="${esc(title)}: ${esc(v)}">${esc(label)}</span>`
}

function roundRow(job, n, v) {
  const current = n === job.round
  const cells = [chip('gate', v.gate, current && job.stage === 'gate', 'gate', 'gate')]
  if (v.gate === 'PASS') {
    for (const r of Object.keys(job.agents.reviewers)) {
      cells.push(chip(SHORT[r] || r, v.reviews[r], current && job.stage === 'review', r))
    }
  }
  return `<div class="round"><span class="r">R${n}</span>${cells.join('')}</div>`
}

function elapsed(job) {
  const start = job.started ? new Date(job.started) : null
  if (!start || Number.isNaN(start.getTime())) return '—'
  const end = job.ended ? new Date(job.ended) : new Date()
  const min = Math.max(0, Math.floor((end - start) / 60000))
  return min >= 60 ? `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}m` : `${min}m`
}

function card(job, rounds) {
  const live = LIVE.has(job.stage)
  const human = job.stage === 'needs-human'
  const done = job.stage === 'merged' || job.stage === 'rejected'
  const [num, ...slug] = job.id.split('-')
  const flag = human ? '<span class="flag">your call</span>'
    : job.stage === 'needs-info' ? '<span class="flag wait">question</span>'
    : job.stage === 'rejected' ? '<span class="flag wait">rejected</span>' : ''
  const risk = job.triage?.risk
  const meta = [
    job.line ? `<span class="line">${esc(job.line)} · pass ${esc(job.pass)}</span>` : '',
    risk ? `<span class="risk-${esc(risk)}">${esc(risk)}</span>` : '',
    modelsChip(job),
    `<span>$${Number(job.cost_usd).toFixed(2)}</span>`,
    `<span>${elapsed(job)}</span>`,
  ].join('')
  return `
    <article class="card ${live ? 'live' : ''} ${human ? 'human' : ''} ${done ? 'done' : ''} ${job.stage}"
             data-job="${esc(job.id)}" tabindex="0">
      <div class="card-top">
        ${live ? '<span class="pulse" aria-label="running"></span>' : ''}
        <span class="num">${esc(num)} · ${esc(slug.join('-'))}</span>
        ${flag}
      </div>
      <p class="feature">${esc(job.title)}</p>
      <div class="links">${esc(job.topic)}.md</div>
      ${rounds.length ? `<div class="rounds">${rounds.join('')}</div>` : ''}
      <div class="meta">${meta}</div>
      ${human ? '<div class="hint">give feedback or reject: /factory &lt;anything&gt;</div>' : ''}
    </article>`
}

// A record from factory/records/ for a job with no folder here. Read-only: no data-job,
// no tabindex, so it never opens the drawer.
// The id number is the only id text shown; the title is the id's words spaced out (the record holds no title).
// A record with no `ended` shows a blank time, not a timer that keeps running.
function recordCard(r) {
  const [num, ...slug] = r.id.split('-')
  const label = slug.join(' ') || String(r.topic || '').replace(/-/g, ' ')
  const risk = r.triage?.risk
  const meta = [
    r.line ? `<span class="line">${esc(r.line)}${r.pass != null ? ` · pass ${esc(r.pass)}` : ''}</span>` : '',
    risk ? `<span class="risk-${esc(risk)}">${esc(risk)}</span>` : '',
    modelsChip(r),
    `<span>$${(Number(r.cost_usd) || 0).toFixed(2)}</span>`,
    `<span>${r.ended ? elapsed(r) : '—'}</span>`,
  ].join('')
  const rejected = r.stage === 'rejected' ? '<span class="flag wait">rejected</span>' : ''
  return `
    <article class="card done record ${esc(r.stage)}">
      <div class="card-top">
        <span class="num">${esc(num)}</span>
        ${rejected}
      </div>
      <p class="feature">${esc(label)}</p>
      <div class="origin" title="This summary was saved from another machine. This machine has no job folder, so there is no detail view.">Recorded on another device</div>
      <div class="meta">${meta}</div>
    </article>`
}

async function render() {
  const problems = []
  const cards = new Map(COLUMNS.map((c) => [c, []]))
  for (const job of jobs) {
    if (!STAGES.has(job.stage)) { problems.push(`Job ${job.id} has unknown stage "${job.stage}"`); continue }
    const rounds = []
    if (job.pass) for (let n = 1; n <= job.round; n++) rounds.push(roundRow(job, n, await roundVerdicts(job, n)))
    cards.get(COLUMNS.find((c) => c.stages.includes(job.stage))).push({ html: card(job, rounds), at: job.ended || '' })
  }
  // A record whose id is a local job is that job's own summary: the local job wins.
  const jobIds = new Set(jobs.map((j) => j.id))
  const shown = records.filter((r) => !jobIds.has(r.id))
  for (const r of shown) cards.get(COLUMNS.find((c) => c.stages.includes(r.stage))).push({ html: recordCard(r), at: r.ended })
  // Done interleaves local and record cards by when they ended. Every column ends up newest first.
  for (const [c, items] of cards) {
    if (c.stages.includes('merged')) items.sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0))
    items.reverse()
  }
  const html = COLUMNS.map((c) => `
    <section class="col ${c.cls || ''} ${cards.get(c).length ? 'has-cards' : ''}">
      <div class="col-head">
        <h2>${c.label}</h2><span class="who">${c.who}</span>
        <span class="count">${cards.get(c).length || ''}</span>
      </div>
      <div class="lane-cards">${cards.get(c).map((x) => x.html).join('') || '<div class="empty">Nothing here</div>'}</div>
    </section>`).join('')
  const banner = problems.map((p) => `<div class="banner">${esc(p)}</div>`).join('')
  if (html + banner !== lastRender) {
    lastRender = html + banner
    $('board').innerHTML = html
    $('banner').innerHTML = banner
  }
  const running = jobs.filter((j) => LIVE.has(j.stage)).length
  const cost = [...jobs, ...shown].reduce((sum, j) => sum + (Number(j.cost_usd) || 0), 0)
  const needYou = jobs.filter((j) => j.stage === 'needs-human' || j.stage === 'needs-info').length
  const merged = jobs.filter((j) => j.stage === 'merged').length + shown.filter((r) => r.stage === 'merged').length
  const tile = (cls, label, value, on = '') => `<div class="kpi ${cls}"><div class="k-label">${label}</div><div class="k-value ${on}">${value}</div></div>`
  $('kpis').innerHTML = tile('k-run', 'Running now', running) + tile('k-human', 'Needs you', needYou, needYou ? 'on' : '') +
    tile('k-done', 'Merged', merged) + tile('k-cost', 'API-equivalent cost', `$${cost.toFixed(2)}`)
}

// ---- Views: tasks not picked up, and per-task statistics ------------------

const VIEWS = ['board', 'pending', 'stats']
let view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'board'
let inboxNames = []
let concurrency = null
const viewCache = {}

function setView(v) {
  view = VIEWS.includes(v) ? v : 'board'
  try { history.replaceState(null, '', `#${view}`) } catch { /* e.g. sandboxed preview */ }
  $('board').hidden = view !== 'board'
  $('view-pending').hidden = view !== 'pending'
  $('view-stats').hidden = view !== 'stats'
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)))
  renderViews().catch(() => {})
}

function setHtml(id, html) {
  if (viewCache[id] !== html) { viewCache[id] = html; $(id).innerHTML = html }
}

function topicInfo(name, text) {
  const lines = text.split('\n')
  const marker = lines[0].match(/factory-issue:\s*(\d+)/)
  const heading = lines.find((l) => /^#\s+/.test(l))
  const body = lines.filter((l) => l.trim() && !/^<!--/.test(l) && !/^#\s+/.test(l)).join(' ')
  return {
    slug: name.replace(/\.md$/, ''),
    title: heading ? heading.replace(/^#\s+/, '') : name,
    issue: marker ? marker[1] : null,
    snippet: body.length > 160 ? `${body.slice(0, 157)}…` : body,
  }
}

async function refreshInbox() {
  try { inboxNames = (await listFiles('inbox/')).filter((f) => !f.includes('/')) } catch { inboxNames = [] }
  if (concurrency === null) {
    try { concurrency = JSON.parse(await fetchText('config.json')).concurrency } catch { concurrency = 0 }
  }
  const taken = new Set(jobs.map((j) => j.topic))
  const n = inboxNames.filter((f) => !taken.has(f.replace(/\.md$/, ''))).length
  $('pending-count').textContent = n ? String(n) : ''
}

function jobRow(job, what) {
  return `<tr data-job="${esc(job.id)}" tabindex="0">
    <td><div class="t-title">${esc(job.title)}</div><div class="t-sub">${esc(job.id)}</div></td>
    <td><span class="badge wait">${esc(job.stage)}</span></td>
    <td class="mono">${esc(what)}</td></tr>`
}

async function renderPending() {
  const taken = new Set(jobs.map((j) => j.topic))
  const names = inboxNames.filter((f) => !taken.has(f.replace(/\.md$/, '')))
  const topics = await Promise.all(names.map(async (n) => {
    try { return topicInfo(n, await fetchText(`inbox/${n}`)) } catch { return topicInfo(n, '') }
  }))
  const running = jobs.filter((j) => LIVE.has(j.stage)).length
  const why = concurrency && running >= concurrency
    ? `Held: ${running} jobs are running (limit ${concurrency}).`
    : 'Queued: the next /factory run will pick it up.'
  const queued = topics.length
    ? `<div class="table-wrap"><table><thead><tr><th>Task</th><th>Source</th><th>Status</th></tr></thead><tbody>${
      topics.map((t) => `<tr>
        <td><div class="t-title">${esc(t.title)}</div><div class="t-sub">${esc(t.snippet || t.slug)}</div></td>
        <td class="mono">${t.issue ? `GitHub issue #${esc(t.issue)}` : `inbox/${esc(t.slug)}.md`}</td>
        <td class="mono">${esc(why)}</td></tr>`).join('')
    }</tbody></table></div>`
    : '<div class="empty">Nothing is waiting. Every topic in the inbox already has a job.</div>'
  const waiting = jobs.filter((j) => j.stage === 'needs-info' || j.stage === 'needs-human')
  const waitingHtml = waiting.length
    ? `<div class="table-wrap"><table><thead><tr><th>Task</th><th>Stage</th><th>What it needs from you</th></tr></thead><tbody>${
      waiting.map((j) => jobRow(j, j.stage === 'needs-info'
        ? 'Answer the question in triage.md, then /factory <your answer>'
        : 'Read decision.md, then /factory <feedback>')).join('')
    }</tbody></table></div>`
    : '<div class="empty">No job is waiting on you.</div>'
  setHtml('view-pending', `
    <div class="block"><h2>Not picked up yet (${topics.length})</h2>
      <p class="lede">Topics in the inbox that have no job. They start the next time /factory run is used.</p>${queued}</div>
    <div class="block"><h2>Parked, waiting on you (${waiting.length})</h2>
      <p class="lede">Jobs that started but cannot continue without your input. Click one to read what it asks.</p>${waitingHtml}</div>`)
}

const jobTokens = (j) => (j.models || []).reduce((n, r) => n + r.tokens, 0)

function autonomy(j) {
  const i = j.interventions
  if (!i) return { cls: '', text: 'unknown', tip: 'Not computed yet for this job' }
  const tip = [`${i.answers} answers`, `${i.feedback} feedback`, `${i.approvals} approvals`,
    i.rejected ? 'you rejected it' : '', i.waiting ? 'waiting on you now' : ''].filter(Boolean).join(', ')
  if (i.waiting) return { cls: 'wait', text: i.total > 1 ? `waiting on you (×${i.total})` : 'waiting on you', tip }
  if (i.total === 0) {
    const finished = j.stage === 'merged' || j.stage === 'rejected'
    return { cls: 'auto', text: finished ? '100% autonomous' : 'autonomous so far', tip: 'No human input was needed' }
  }
  return { cls: 'human', text: `needed you ×${i.total}`, tip }
}

async function renderStats() {
  const rows = [...jobs].sort((a, b) => b.id.localeCompare(a.id))
  let tokens = 0, cost = 0, auto = 0, finished = 0
  const body = rows.map((j) => {
    const known = (j.models || []).length > 0
    const t = jobTokens(j)
    tokens += t
    cost += Number(j.cost_usd)
    const done = j.stage === 'merged' || j.stage === 'rejected'
    if (done) { finished += 1; if (j.interventions && j.interventions.total === 0) auto += 1 }
    const a = autonomy(j)
    const names = known ? [...new Set(j.models.map((r) => modelName(r.model)))].join(' · ') : (Number(j.cost_usd) > 0 ? 'n/a' : '—')
    const tip = known ? j.models.map((r) => `${r.step}: ${r.model} (${r.calls} calls, ${r.tokens.toLocaleString()} tokens)`).join('\n')
      : 'Recorded before per-step models were tracked'
    return `<tr data-job="${esc(j.id)}" tabindex="0">
      <td><div class="t-title">${esc(j.title)}</div><div class="t-sub">${esc(j.id)}${j.line ? ` · ${esc(j.line)}` : ''}</div></td>
      <td><span class="badge">${esc(j.stage)}</span></td>
      <td class="mono" title="${esc(tip)}">${esc(names)}</td>
      <td class="num">${known ? t.toLocaleString() : (Number(j.cost_usd) > 0 ? 'n/a' : '—')}</td>
      <td class="num">$${Number(j.cost_usd).toFixed(2)}</td>
      <td class="num">${esc(elapsed(j))}</td>
      <td class="num">${j.interventions ? j.interventions.total : '—'}</td>
      <td><span class="badge ${a.cls}" title="${esc(a.tip)}">${esc(a.text)}</span></td></tr>`
  }).join('')
  setHtml('view-stats', `
    <div class="block"><h2>Task statistics (${rows.length})</h2>
      <p class="lede">Cost is API-equivalent dollars, not a bill. Elapsed is wall-clock time from start to finish and includes time spent waiting for you.
      Tokens add up input (including cached input), cache writes and output; most of a large total is usually cached input.
      Tokens and models show n/a for jobs run before they were recorded. Click a row to open the job.</p>
      ${rows.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Task</th><th>Stage</th><th>Model</th><th class="num">Tokens</th><th class="num">Cost</th><th class="num">Elapsed</th><th class="num">Human steps</th><th>Autonomy</th></tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr><td>Total</td><td></td><td></td><td class="num">${tokens.toLocaleString()}</td><td class="num">$${cost.toFixed(2)}</td><td></td><td></td>
        <td>${auto} of ${finished} finished fully autonomous</td></tr></tfoot></table></div>`
        : '<div class="empty">No jobs yet.</div>'}</div>`)
}

async function renderViews() {
  await refreshInbox()
  if (view === 'pending') await renderPending()
  if (view === 'stats') await renderStats()
}

async function poll() {
  const status = $('status')
  try {
    jobs = await loadJobs()
    const found = await loadRecords()
    if (found) records = found  // null: the listing failed; keep what was shown
    await render()
    await renderViews()
    if (openJobId) await refreshDrawer()
    status.className = 'status'
    status.innerHTML = `<span class="dot"></span>jobs/ · ${new Date().toLocaleTimeString()}`
  } catch (err) {
    status.className = 'status error'
    status.innerHTML = `<span class="dot"></span>${esc(err.message)}`
  }
}

// factory/bin/job writes each jobs/<id>/job.json.
async function loadJobs() {
  let listing
  try { listing = await fetchText('jobs/') } catch { return [] }
  const doc = new DOMParser().parseFromString(listing, 'text/html')
  const ids = [...doc.querySelectorAll('a')]
    .map((a) => decodeURIComponent(a.getAttribute('href')))
    .filter((h) => h.endsWith('/'))
    .map((h) => h.slice(0, -1))
    .sort()
  return Promise.all(ids.map(async (id) => JSON.parse(await fetchText(`jobs/${id}/job.json`))))
}

// factory/bin/job writes factory/records/<id>.json at final merge and at reject. Records are
// committed, so every machine with the repo can show a finished job it has no folder for.
// Returns the valid records, or null when the listing could not be read.
const RECORD_NAME = /^[0-9A-Za-z][0-9A-Za-z._-]*\.json$/
const RECORD_ID = /^[0-9A-Za-z][0-9A-Za-z._-]*$/
const RECORD_STAGES = new Set(['merged', 'rejected'])
async function loadRecords() {
  let listing
  try { listing = await fetchText('records/') } catch (err) {
    if (/HTTP 404/.test(err.message)) { recordCache.clear(); return [] } // no records/ folder yet
    return null
  }
  const doc = new DOMParser().parseFromString(listing, 'text/html')
  const names = [...doc.querySelectorAll('a')]
    .map((a) => { try { return decodeURIComponent(a.getAttribute('href') || '') } catch { return '' } })
    .filter((h) => RECORD_NAME.test(h))
  for (const key of [...recordCache.keys()]) if (!names.includes(key)) recordCache.delete(key)
  for (const name of names) {
    if (recordCache.has(name)) continue
    let text
    try { text = await fetchText(`records/${encodeURIComponent(name)}`) } catch { continue } // retry next poll
    let rec = null
    try {
      const parsed = JSON.parse(text)
      if (parsed && typeof parsed.id === 'string' && RECORD_ID.test(parsed.id) &&
          RECORD_STAGES.has(parsed.stage)) {
        if (typeof parsed.ended !== 'string') parsed.ended = ''  // orders the record among Done cards
        // models feeds modelsChip, which needs numeric calls and tokens; anything else drops the chip.
        if (!Array.isArray(parsed.models) ||
            !parsed.models.every((m) => m && typeof m.tokens === 'number' && typeof m.calls === 'number')) parsed.models = []
        rec = parsed
      }
    } catch { rec = null }
    recordCache.set(name, rec)
  }
  return names.map((n) => recordCache.get(n)).filter(Boolean)
}

// ---- Drawer --------------------------------------------------------------

// python -m http.server serves an HTML index for directories; read its links.
async function listFiles(dir) {
  const doc = new DOMParser().parseFromString(await fetchText(dir), 'text/html')
  const hrefs = [...doc.querySelectorAll('a')].map((a) => decodeURIComponent(a.getAttribute('href')))
  const out = []
  for (const h of hrefs) {
    if (h.endsWith('/')) out.push(...(await listFiles(dir + h)).map((f) => h + f))
    else if (h.endsWith('.md')) out.push(h)
  }
  return out
}

// Top-level job files, in the order they happen.
const ORDER = ['topic.md', 'triage.md', 'rejection.md']
const ROUND_ORDER = ['checks', 'review-code', 'review-security', 'review-ux', 'review-ui', 'merge-checks']
const PASS_ORDER = ['spec.md', 'build.md', 'decision.md']

function fileRank(path) {
  if (ORDER.includes(path)) return [0, ORDER.indexOf(path), path]
  const pass = path.match(/^(\d\d)-([^/]+)\/(.+)$/)
  if (pass) {
    const [, n, , rest] = pass
    const round = rest.match(/^round-(\d+)\/(.+)\.md$/)
    const inPass = round
      ? 1000 + Number(round[1]) * 10 + ROUND_ORDER.indexOf(round[2])
      : PASS_ORDER.includes(rest) ? PASS_ORDER.indexOf(rest) : 500 // feedback-<k>.md
    return [2, Number(n) * 10000 + inPass, path]
  }
  return [1, 0, path] // triage-<k>.md, answer-<k>.md, handoff-<k>.md
}

function sortFiles(files) {
  return files.sort((a, b) => {
    const [x, y] = [fileRank(a), fileRank(b)]
    return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2])
  })
}

function tone(first) {
  if (/^(VERDICT:\s*PASS|GATE:\s*PASS|APPROVE|STATUS:\s*READY|DECISION:\s*ACCEPT)$/.test(first)) return 'good'
  if (/^(VERDICT:\s*CHANGES|DECISION:\s*NEEDS-INFO)$/.test(first)) return 'warn'
  if (/^(ESCALATE|REJECTED|STATUS:\s*BLOCKED|GATE:\s*FAIL|DECISION:\s*REJECT)$/.test(first)) return 'stop'
  return null
}

const firstLines = new Map()

async function refreshDrawer() {
  const job = jobs.find((j) => j.id === openJobId)
  if (!job) return
  $('d-num').textContent = `${job.id} · ${job.stage}${job.line ? ` · ${job.line}` : ''}${job.round ? ` · round ${job.round}` : ''} · $${Number(job.cost_usd).toFixed(2)} · ${elapsed(job)}`
  $('d-title').textContent = job.title
  $('d-links').innerHTML = `<span>${esc(job.topic)}</span>${modelsTable(job)}`

  const base = `jobs/${job.id}/`
  const files = sortFiles(await listFiles(base))
  if (!openPath || !files.includes(openPath)) openPath = files[0] || null

  let text = null
  if (openPath) {
    text = await fetchText(base + openPath)
    firstLines.set(base + openPath, text.split('\n')[0].trim())
  }
  await Promise.all(files.filter((f) => !firstLines.has(base + f)).map(async (f) => {
    firstLines.set(base + f, (await fetchText(base + f)).split('\n')[0].trim())
  }))

  let group = null
  $('d-files').innerHTML = files.map((f) => {
    const pass = f.match(/^(\d\d-[^/]+)\/(.+)$/)
    const g = pass ? pass[1] : (f.includes('-') && !ORDER.includes(f) ? 'Job' : 'Job')
    const head = g !== group ? `<div class="group">${esc(g)}</div>` : ''
    group = g
    const rest = pass ? pass[2] : f
    const round = rest.match(/^round-(\d+)\/(.+)$/)
    const name = round
      ? `<span class="rn">R${round[1]} </span>${esc(round[2].replace(/^review-|\.md$/g, ''))}`
      : esc(rest)
    const t = tone(firstLines.get(base + f) || '')
    return `${head}<button class="file ${f === openPath ? 'on' : ''}" data-file="${esc(f)}">
      <span class="v ${t || ''}"></span>${name}</button>`
  }).join('') || '<div class="empty">No files yet.</div>'

  if (text !== openText) {
    openText = text
    $('d-doc').innerHTML = text === null ? '<p class="note">Triage hasn’t written anything yet.</p>' : markdown(text)
  }
}

async function openDrawer(id) {
  openJobId = id
  openPath = null
  openText = undefined
  document.body.classList.add('open')
  try {
    await refreshDrawer()
  } catch (err) {
    $('d-doc').innerHTML = `<p class="note">${esc(err.message)}</p>`
  }
}

function closeDrawer() {
  openJobId = null
  document.body.classList.remove('open')
}

document.addEventListener('click', (e) => {
  if (e.target.closest('a')) return
  const viewEl = e.target.closest('[data-view]')
  if (viewEl) return setView(viewEl.dataset.view)
  const cardEl = e.target.closest('[data-job]')
  if (cardEl) return openDrawer(cardEl.dataset.job)
  const fileEl = e.target.closest('[data-file]')
  if (fileEl) {
    openPath = fileEl.dataset.file
    openText = undefined
    $('d-doc').parentElement.scrollTop = 0
    return refreshDrawer()
  }
  if (e.target.closest('[data-close]')) closeDrawer()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return closeDrawer()
  const cardEl = e.target.closest?.('[data-job]')
  if (cardEl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDrawer(cardEl.dataset.job) }
})

// ---- Markdown (just enough for the factory's files) ---------------------

function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}

// Every step's file has a `## Summary` of a few bullets; show it first, in a box.
function splitSummary(lines) {
  const start = lines.findIndex((l) => /^##\s+Summary\s*$/.test(l))
  if (start === -1) return { lines, summary: null }
  let end = start + 1
  while (end < lines.length && !/^#{1,2}\s/.test(lines[end])) end++
  return {
    lines: [...lines.slice(0, start), ...lines.slice(end)],
    summary: lines.slice(start + 1, end).join('\n'),
  }
}

function markdown(src) {
  const split = splitSummary(src.replace(/\r/g, '').split('\n'))
  const lines = split.lines
  let i = 0
  let html = ''
  const first = (lines[0] || '').trim()
  const t = tone(first)
  if (t) {
    html += `<div class="verdict ${t}">${esc(first)}</div>`
    i = 1
    // The rest of a KEY: value header block (triage.md, checks.md).
    const extra = []
    while (i < lines.length && /^[A-Z-]+:\s/.test(lines[i])) extra.push(lines[i++])
    if (extra.length) html += `<div class="head">${esc(extra.join('\n'))}</div>`
  }
  if (split.summary !== null) html += `<section class="summary"><h2>Summary</h2>${markdown(split.summary)}</section>`

  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|```|\s*>|\|)/.test(l) || isList(l)

  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }

    if (line.startsWith('```')) {
      const body = []
      i++
      while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++])
      i++
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`
      continue
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }

    if (/^\s*>/.test(line)) {
      const body = []
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${markdown(body.join('\n'))}</blockquote>`
      continue
    }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line)
      const items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task
          ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>`
          : `<li${style}>${inline(text)}</li>`
      }).join('')
      html += ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}

// ---- Theme ---------------------------------------------------------------

const THEME_KEY = 'syntra-factory-theme'
let userChose = false // set by a toggle click this page session

// Saved value, or null when nothing valid is saved or storage is unavailable.
// The validation here must stay identical to the head script's check.
function savedTheme() {
  try {
    const v = localStorage.getItem(THEME_KEY)
    return v === 'light' || v === 'dark' ? v : null
  } catch { return null }
}

// Sets data-theme and keeps the toggle's label and aria-label in step with it.
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme)
  const next = theme === 'dark' ? 'light' : 'dark'
  const btn = $('theme-toggle')
  btn.textContent = next === 'light' ? 'Light' : 'Dark'
  btn.setAttribute('aria-label', `Switch to ${next} theme`)
  btn.title = `Switch to ${next} theme`
}

applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark')

$('theme-toggle').addEventListener('click', () => {
  userChose = true
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'
  try { localStorage.setItem(THEME_KEY, next) } catch { /* storage unavailable: session only */ }
  applyTheme(next)
})

// Follow the OS only while the user has made no choice (saved or clicked).
const lightQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null
const onOsThemeChange = (e) => {
  if (userChose || savedTheme() !== null) return
  applyTheme(e.matches ? 'light' : 'dark')
}
if (lightQuery) {
  if (lightQuery.addEventListener) lightQuery.addEventListener('change', onOsThemeChange)
  else if (lightQuery.addListener) lightQuery.addListener(onOsThemeChange)
}

setView(view)
poll()
setInterval(poll, POLL_MS)
</script>
